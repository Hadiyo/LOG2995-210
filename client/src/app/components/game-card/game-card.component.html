<article
  class="card"
  tabindex="0"
  [attr.title]="map.description"
  (click)="onSelect()"
  (keydown.enter)="onSelect()"
  (keydown.space)="onSelect(); $event.preventDefault()"
>
  <div class="thumbnail">
    @if (thumbnailUrl) {
      <img
        class="thumbnail-img"
        [src]="'data:image/' + (map.previewImageFormat ?? 'webp') + ';base64,' + thumbnailUrl"
        [attr.alt]="'Apercu de ' + map.name"
      />
    } @else {
      <div class="thumbnail-placeholder">
        <span>Apercu indisponible</span>
      </div>
    }
    <div class="description" aria-hidden="true">
      <span class="description-label">Description</span>
      <p>{{ map.description}}</p>
    </div>
  </div>

  <div class="content">
    <h3 class="name">{{ map.name }}</h3>
    <div class="meta">
      <span class="chip">Taille: {{ map.size }}</span>
      <span class="chip">Mode: {{ modeLabel }}</span>
      <div class="meta-row">
        <span class="chip">
          Modifiee:
          @if (map.date) {
            <time [attr.datetime]="map.date">{{ map.date | date: 'mediumDate' }}</time>
          } @else {
            <time>—</time>
          }
        </span>
        @if (showActions) {
          <div class="actions">
            <button
              type="button"
              class="icon-button"
              title="Modifier"
              aria-label="Modifier"
                (click)="$event.stopPropagation(); onEdit()"
            >
              <!-- Generated by ChatGPT -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M4 20h4l11-11a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 16v4Z"
                      fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M13.5 6.5 17.5 10.5"
                      fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M4 16l4 4"
                      fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
              </svg>
              <span class="sr-only">Modifier</span>
            </button>

            <button
              type="button"
              class="icon-button"
              [attr.title]="map.visibility ? 'Masquer' : 'Rendre visible'"
              [attr.aria-label]="map.visibility ? 'Masquer' : 'Rendre visible'"
                (click)="$event.stopPropagation(); onToggleVisibility()"
            >
              @if (map.visibility) {
                <!-- Generated by ChatGPT -->
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M1.8 12s3.9-7 10.2-7 10.2 7 10.2 7-3.9 7-10.2 7S1.8 12 1.8 12Z"
                        fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3.0" fill="currentColor" opacity=".9"/>
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M1.8 12s3.9-7 10.2-7 10.2 7 10.2 7-3.9 7-10.2 7S1.8 12 1.8 12Z"
                        fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3.0" fill="currentColor" opacity=".9"/>
                  <path d="M4 20 20 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              }
              <span class="sr-only">{{ map.visibility ? 'Masquer' : 'Rendre visible' }}</span>
            </button>

            <button
              type="button"
              class="icon-button icon-button--danger"
              title="Supprimer"
              aria-label="Supprimer"
                (click)="$event.stopPropagation(); onRemove()"
            >
              <!-- Generated by ChatGPT -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M9 3.5h6l.9 1.3H20a.9.9 0 1 1 0 1.8H4a.9.9 0 0 1 0-1.8h4.1L9 3.5Z"
                      fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <path d="M6.8 7.2h10.4l-.9 13.2c-.1 1-1 1.6-1.9 1.6H9.6c-.9 0-1.8-.6-1.9-1.6L6.8 7.2Z"
                      fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <path d="M9.2 10v9.2M12 10v9.2M14.8 10v9.2"
                      fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
              </svg>
              <span class="sr-only">Supprimer</span>
            </button>
          </div>
        }
      </div>
    </div>
  </div>

</article>
