<!-- Top bar wrapper
     - Global editor controls (tools, mode, size, actions)
     - Stays visually compact and always accessible -->
<div class="topbar-wrap">
  <!-- =========================
       Back action
       ========================= -->
  <button
    type="button"
    class="icon-btn"
    (click)="onBack()"
    title="Retour"
    aria-label="Retour"
  >
    <!-- Back arrow icon, generated using ChatGPT -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path 
        d="M19 12H6M12 18L6 12L12 6"
        stroke="currentColor"
        stroke-width="2"
      />
    </svg>
  </button>

  <!-- =========================
       Hotkeys
       ========================= -->
  <div class="group-label">
    <span 
      class="key" 
      [class.pressed]="this.isRightClicking() && !this.editorState.isShiftPressed()"
    >
      RMB
    </span> 
    pour effacer des tuiles,

    <span 
      class="key" 
      [class.pressed]="this.editorState.isShiftPressed()"
    >
      SHIFT
    </span> 
    + 
    <span 
      class="key" 
      [class.pressed]="this.isRightClicking() && this.editorState.isShiftPressed()"
    >
      RMB
    </span> 
    pour effacer des objets
  </div>

  <!-- Spacer pushes action buttons to the right -->
  <div class="spacer"></div>

  <!-- =========================
       Save action + validation status
       ========================= -->
  @if (validationResult(); as result) {
    <button
      type="button"
      class="icon-btn"
      [class.success]="result.isValid"
      [class.invalid]="!result.isValid"
      (click)="onSave()"
      title="Enregistrer"
      aria-label="Enregistrer"
    >
      <!-- Save icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4Zm0 2.5L19.5 8H17V5.5Z
             M7 5h8v5H7V5Zm12 14H5V5h1v7h10V5h.5L19 7.5V19Z"
        />
      </svg>
    </button>
  }


  <!-- =========================
       Reset action
       ========================= -->
  <button
    type="button"
    class="icon-btn"
    (click)="onReset()"
    title="Réinitialiser"
    aria-label="Réinitialiser"
  >
    <!-- Reset / refresh icon -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.9-1h-2.02A7 7 0 1 0 12 6Z"
      />
    </svg>
  </button>


  <!-- =========================
       Cancel action
       ========================= -->
  <button
    type="button"
    class="icon-btn danger"
    (click)="onCancel()"
    title="Annuler"
    aria-label="Annuler"
  >
    <!-- Cancel / close icon -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.29 9.17 12 2.88 5.71 4.29 4.29l6.3 6.31 6.3-6.31 1.41 1.42Z"
      />
    </svg>
  </button>

</div>

@if (hasAttemptedSave() && !validationResult().isValid) {
  <div class="validation-panel" role="alert" aria-live="polite">
    <div class="validation-title">Problemes de validation</div>
    <ul class="validation-list">
      @for (issue of validationResult().issues; track issue.code) {
        <li>{{ issue.message }}</li>
      }
    </ul>
  </div>
}
