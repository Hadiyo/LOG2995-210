for@ (tile of tileType()) {
    <EditorToolsComponent>
        [tool]="tile"
        (clicked)="clickTool($event)"
    </EditorToolsComponent>
    
}

for@ (object of objectType()) {
    <EditorToolsComponent>
        [tool]="object"
        (clicked)="clickTool($event)"
    </EditorToolsComponent>
}
