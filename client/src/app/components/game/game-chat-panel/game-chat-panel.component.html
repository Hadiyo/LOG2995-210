@if (showTitle) {
  <header class="messages__header">
    <h3>{{ title }}</h3>
    @if (currentPlayerName) {
      <p class="player__name">{{ currentPlayerName }}</p>
    }
  </header>
}
<div class="messages__feed-wrap">
  <div #messagesFeed class="messages__feed">
    @for (message of messages; track message.id) {
      <article
        class="message"
        [class.message--mine]="isOwnMessage(message)"
        [class.message--system]="message.author === 'SYSTEM'"
      >
        <header class="message__meta">
          <strong class="message__author">{{ message.author }}</strong>
          <span class="message__time">{{ message.createdAt | date:'HH:mm:ss' }}</span>
        </header>
        <p class="message__content">{{ message.content }}</p>
      </article>
    }
  </div>
  <!-- Notification panel is rendered within the feed to appear above messages. -->
  <app-game-notifications-panel class="messages__notification" [notification]="notification" />
</div>
@if (!readOnly) {
  <div class="messages__input-row">
    <input
      type="text"
      class="messages__input"
      [value]="messageInput()"
      [attr.maxlength]="messageMaxLength"
      placeholder="Envoyer un message..."
      (input)="onMessageInput($event)"
      (keydown.enter)="submitMessage()"
    />
    <button type="button" class="messages__send-btn" (click)="submitMessage()">Envoyer</button>
  </div>
}
