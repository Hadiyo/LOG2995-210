<div class="combat-stage combat-stage--horizontal" [class.combat-stage--rotated]="!isHorizontal">
  @for (fighter of fighters; track fighter.id) {
    <article
      class="combat-stage__tile"
      [class.combat-stage__tile--local]="fighter.isLocal"
      [class.combat-stage__tile--attacking]="fighter.pose === 'attack'"
      [class.combat-stage__tile--defending]="fighter.isDefending"
      [class.combat-stage__tile--dead]="fighter.pose === 'dead'"
      [class.combat-stage__tile--hit]="fighter.isHit"
      [ngClass]="getTeamClass(fighter.teamId)"
      [attr.data-facing]="fighter.facing"
      [attr.data-tile]="fighter.tileType"
      [attr.data-door-open]="fighter.tileType === tileType.DOOR && fighter.isDoorOpen ? 'true' : null"
      [attr.data-door-closed]="fighter.tileType === tileType.DOOR && !fighter.isDoorOpen ? 'true' : null"
    >
      <div class="combat-stage__sprite">
        <app-character-sprite
          [avatarId]="fighter.avatarId"
          [class.is-idle]="fighter.pose === 'idle'"
          [state]="fighter.pose"
          [direction]="fighter.facing"
          [fitToHost]="true"
          [smoothingEnabled]="true"
          [ariaLabel]="'Avatar de ' + fighter.name"
        />
      </div>
    </article>
  }

  @if (endingNotice; as ending) {
    <div class="combat-stage__ending">
      <p class="combat-stage__ending-eyebrow">Combat terminé</p>
      <h3 class="combat-stage__ending-title">{{ getEndingTitle(ending) }}</h3>
      <p class="combat-stage__ending-message">{{ getEndingMessage(ending) }}</p>
    </div>
  }
</div>
