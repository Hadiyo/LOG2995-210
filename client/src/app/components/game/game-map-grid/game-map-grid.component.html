<div class="grid" [class.grid--action-mode]="actionModeEnabled" [style.--cols]="cols" [style.--rows]="rows">
   <!-- Angular @for over all cells; $index used as click target index -->
  @for (cell of cells; track $index) {
    <button
      type="button"
      class="cell"
      [class.cell--reachable]="isReachableCell(cell)"
      [class.cell--reachable-origin]="isReachableOrigin(cell)"
      [class.cell--action-target]="isActionTarget(cell)"
      (click)="onCellClick($index)"
      (contextmenu)="onCellContextMenu($event, $index)"
    >
       <!-- Base tile layer with tile type and door-open/closed flags -->
      <span
        class="tile"
        [attr.data-tile]="cell.tileType"
        [attr.data-door-open]="cell.tileType === tileType.DOOR && cell.isWalkable ? 'true' : null"
        [attr.data-door-closed]="cell.tileType === tileType.DOOR && !cell.isWalkable ? 'true' : null"
      ></span>

      <!-- Optional object layer if object exists on this cell -->
      @if (getObjectAtCell(cell); as object) {
        <span
          class="obj"
          [attr.data-obj]="object.type"
          [attr.data-size]="object.size"
          [attr.data-used]="isUsedSanctuary(object) ? 'true' : null"
        ></span>
      }

      <!-- Optional player layer if a player occupies this cell -->
      @if (getPlayerAtCell(cell); as player) {
        <span
          class="player-layer"
          [ngClass]="getTeamClass(player.information.teamId)"
          [attr.title]="getVirtualPlayerTitle(player)"
        >
          <span class="player-layer__avatar-frame">
            <app-character-sprite
              [avatarId]="getAvatarId(player)"
              [class.is-idle]="getPlayerState(player) === 'idle'"
              [style.animationDelay]="getBreathingDelay(player.id)"
              [state]="getPlayerState(player)"
              [direction]="getPlayerDirection(player)"
              [fitToHost]="true"
              [smoothingEnabled]="true"
              [ariaLabel]="getAvatarAriaLabel(player)"
            />
            @if (isVirtualPlayer(player)) {
              <span
                class="player-bot-icon"
                [attr.data-virtual-profile]="getVirtualPlayerProfile(player)"
                aria-hidden="true"
              >
                <svg viewBox="0 0 16 16" focusable="false" aria-hidden="true">
                  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2">
                    <path d="M6.5 2.2h3" />
                    <path d="M8 2.2V4" />
                    <rect x="3.2" y="4.3" width="9.6" height="7.8" rx="2.2" />
                    <path d="M5.5 13.1v-1.1" />
                    <path d="M10.5 13.1v-1.1" />
                    <path d="M3.2 8H2" />
                    <path d="M14 8h-1.2" />
                    <path d="M6.2 8h.01" />
                    <path d="M9.8 8h.01" />
                    <path d="M6 10h4" />
                  </g>
                </svg>
              </span>
            }
            @if (player.state.hasFlag) {
              <span
                class="player-layer__flag-badge"
                aria-label="Porte le drapeau"
                title="Porte le drapeau"
              >
                ⚑
              </span>
            }
          </span>
        </span>
      }
    </button>
  }
</div>
