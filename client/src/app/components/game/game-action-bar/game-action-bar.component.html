<div class="action-bar">
  <button type="button" class="action-btn action-btn--secondary" [disabled]="!canEndTurn" (click)="endTurn.emit()">Terminer<br> le tour</button>
  <button type="button" class="action-btn action-btn--primary" [disabled]="!canAct || !canUseActionMode" [class.action-btn--active]="actionModeEnabled"
    (click)="toggleActionMode.emit()">
    {{ actionModeEnabled ? 'Action active' : 'Mode action' }}
  </button>
  <button type="button" class="action-btn action-btn--danger" (click)="surrender.emit()">Quitter</button>
</div>
