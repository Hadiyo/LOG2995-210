<div class="end-game-container">
    <div>
        <div class="end-stats">
            <div class="header-row">
                <app-back-button (pressed)="leaveMatch('Retour a l accueil.')">
                </app-back-button>    
                <div>
                    <h2>Statistiques de fin de partie</h2>
                </div>
            </div>
            <app-end-stats
                (onEmptyStats)="leaveMatch('Retour a l accueil car aucune statistiques.')"
            ></app-end-stats>
        </div>
    </div>
    <section class="panel messages">
        <div class="panel__header">
          <h3>Zone des messages</h3>
        </div>
        <div class="messages--tabs">
          <div class="panel__tabs" role="tablist" aria-label="Zone des messages">
            <div class="panel__tab-list">
              <button
                type="button"
                class="panel__tab"
                [class.panel__tab--active]="messageTab() === 'chat'"
                role="tab"
                [attr.aria-selected]="messageTab() === 'chat'"
                (click)="onMessageTabChange('chat')"
              >
                Clavardage
              </button>
              <button
                type="button"
                class="panel__tab"
                [class.panel__tab--active]="messageTab() === 'journal'"
                role="tab"
                [attr.aria-selected]="messageTab() === 'journal'"
                (click)="onMessageTabChange('journal')"
              >
                Journal de jeu
              </button>
            </div>
          </div>

          @if (messageTab() === 'chat') {
            <app-game-chat-panel class="chat"
              [messages]="chatMessages()"
              [notification]="null"
              [currentPlayerName]="currentPlayer?.name ?? null"
              [messageMaxLength]="constants.messageMaxLength"
              [title]="'Clavardage'"
              [showTitle]="false"
              [readOnly]="false"
              (messageSubmit)="onChatMessageSubmit($event)"
            />
          } @else {
            <app-game-chat-panel
              [messages]="journalEntries()"
              [notification]="null"
              [currentPlayerName]="null"
              [title]="'Journal de jeu'"
              [showTitle]="false"
              [readOnly]="true"
            />
          }
        </div>
    </section>
</div>
