<div class="end-game-container">
    <app-end-stats
        (onEmptyStats)="leaveMatch('Retour a l accueil.')"
    ></app-end-stats>
    <app-game-chat-panel class="chat"
        [messages]="chatMessages()"
        [notification]="null"
        [currentPlayerName]="currentPlayer?.name ?? null"
        [messageMaxLength]="constants.messageMaxLength"
        [title]="'Clavardage'"
        [showTitle]="true"
        [readOnly]="false"
        (messageSubmit)="onChatMessageSubmit($event)"
    >
    </app-game-chat-panel>

    <button class="btn-secondary" (click)="leaveMatch('Retour a l accueil.')">
        Quitter la partie
    </button>
</div>
