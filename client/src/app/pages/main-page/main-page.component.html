<video
  #backgroundVideo
  class="background-video"
  autoplay
  loop
  playsinline
  preload="auto"
  aria-hidden="true"
>
  <source src="/assets/videos/video.mp4" type="video/mp4" />
</video>

<main class="page">
  <header class="hero">
    <div class="hero-row">
      <img class="hero-logo" src="../assets/images/logo.png" alt="Logo Equipe 210" />
    </div>
  </header>

  @if (flashMessage()) {
    <div class="flash-message" role="status">{{ flashMessage() }}</div>
  }

  <div class="main-actions">
    @for (action of actions; track action.id) {
      <app-button
        [label]="action.label"
        [link]="action.link"
        [variant]="action.variant"
      ></app-button>
    }
  </div>

  <app-name-slider [names]="teamNames"></app-name-slider>
</main>
