<main class="page">
  <h1 class="title">Administration</h1>
  <div class="actions">
    <app-button
      label="Creer un nouveau jeu"
      variant="primary"
      (click)="toggleGameDialog()"
    ></app-button>
  </div>

  @if (isCreateDialogOpen) {
    <app-create-game-dialog
      (cancel)="toggleGameDialog()"
      (confirm)="onCreateGameDialogConfirm($event)"
    ></app-create-game-dialog>
  }
</main>
