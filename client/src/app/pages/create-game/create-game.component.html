<div class="page">
  <h1 class="title">Création de partie</h1>

  <div class="game-grid">
    <div class="game-card" *ngFor="let game of games">
      <img [src]="game.previewUrl" class="preview-img" alt="Aperçu">
      <div class="card-content">
        <h3>{{ game.name }}</h3>
        <p>Mode: {{ game.mode }}</p>
        <p>Taille: {{ game.size }}</p>
      </div>
      <button class="btn-select" (click)="selectGame(game.id)">Sélectionner</button>
    </div>
  </div>
</div>
