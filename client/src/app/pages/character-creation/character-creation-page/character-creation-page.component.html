<div class="page">
    <div class="left">
        <div class="header-row header-row--title">
            <app-back-button link="/game" title="Retour à la création de partie"></app-back-button>
            <h2>Créer votre personnage</h2>
        </div>

        @if (errorMessage) {
        <div class="join-error" role="alert">{{ errorMessage }}</div>
        }

        <label class="field">
            <span>Nom
                @if (form.controls.name.touched && form.controls.name.invalid) {
                <small>Nom requis (max {{ nameMaxLength }})</small>
                }
            </span>

            <div class="input-with-actions">
                <input type="text" [formControl]="form.controls.name" [maxlength]="nameMaxLength"
                    placeholder="lettres, chiffres, espace, - et ’" (input)="onNameInput($event)" />
                <button type="button" class="mini-btn btn-clear-name" (click)="form.controls.name.setValue('')">Effacer</button>
            </div>

            <div class="actions actions-name">
                <button type="button" class="btn-generate" (click)="onGenerate()">Générer personnage</button>
                <button type="button" class="btn-validate" [disabled]="(isLocked$ | async) !== false" (click)="onSubmit()">Valider</button>
            </div>
        </label>

        <div class="section-row">
            <div class="section">
                <h3>Bonus +2</h3>
                <div class="option-group">
                    <button type="button" class="option" [class.active]="form.controls.plusTwo.value === 'health'"
                        (click)="form.controls.plusTwo.setValue('health')">
                        <span>Vie</span>
                        @if (form.controls.plusTwo.value === 'health') {
                        <span class="option-hint">Vie +2</span>
                        }
                    </button>

                    <button type="button" class="option" [class.active]="form.controls.plusTwo.value === 'speed'"
                        (click)="form.controls.plusTwo.setValue('speed')">
                        <span>Rapidité</span>
                        @if (form.controls.plusTwo.value === 'speed') {
                        <span class="option-hint">Rapidité +2</span>
                        }
                    </button>
                </div>
            </div>

            <div class="section">
                <h3>Dé D6 attribué à</h3>
                <div class="option-group">
                    <button type="button" class="option" [class.active]="form.controls.d6GoesTo.value === 'attack'"
                        (click)="form.controls.d6GoesTo.setValue('attack')">
                        <span>Attaque <small>(Défense reçoit D4)</small></span>
                        <span class="option-hint" [class.hint-dim]="form.controls.d6GoesTo.value !== 'attack'">
                            {{ form.controls.d6GoesTo.value === 'attack' ? 'Attaque + D6' : 'Attaque + D4' }}
                        </span>
                    </button>

                    <button type="button" class="option" [class.active]="form.controls.d6GoesTo.value === 'defense'"
                        (click)="form.controls.d6GoesTo.setValue('defense')">
                        <span>Défense <small>(Attaque reçoit D4)</small></span>
                        <span class="option-hint" [class.hint-dim]="form.controls.d6GoesTo.value !== 'defense'">
                            {{ form.controls.d6GoesTo.value === 'defense' ? 'Défense + D6' : 'Défense + D4' }}
                        </span>
                    </button>
                </div>

            </div>
        </div>

        <div class="section">
            <h3>Avatar
                @if (form.controls.avatarId.touched && form.controls.avatarId.invalid) {
                <small>Choisis un avatar</small>
                }
            </h3>
            <div class="avatar-grid">
                @for (id of avatars; track id) {
                <button type="button" class="avatar" [class.selected]="id === form.controls.avatarId.value"
                    [class.avatar--taken]="(takenAvatars$ | async)?.includes(id)"
                    [disabled]="(takenAvatars$ | async)?.includes(id)" [style.background]="avatarFallbackColors[id]" (click)="onSelectAvatar(id)">
                    <img [src]="getAvatarThumbPath(id)" [alt]="'Avatar ' + id" />
                </button>
                }
            </div>
        </div>
    </div>

    <div class="right">
        <div class="header-row">
            <h3>Aperçu</h3>
        </div>
        <app-character-creation-preview
            [avatarId]="form.controls.avatarId.value"
            [avatarBackground]="form.controls.avatarId.value !== null ? avatarFallbackColors[form.controls.avatarId.value] : null"
            [avatarThumbPath]="form.controls.avatarId.value !== null ? getAvatarThumbPath(form.controls.avatarId.value) : null"
            [displayName]="form.controls.name.value || 'Sans nom'"
            [subtitle]="selectedAvatarProfile()?.subtitle ?? null"
            [description]="selectedAvatarProfile()?.description ?? null"
            [plusTwo]="form.controls.plusTwo.value ?? 'health'"
            [d6GoesTo]="form.controls.d6GoesTo.value ?? 'attack'"
            [isLocked]="(isLocked$ | async) === true"
            (leave)="onLeavingCharacterCreation()"
        />
    </div>
</div>
